[project]
name = "2become1"
version = "0.2.0"
description = "General-purpose mash-up stack: analyze, separate, align, and recombine any two tracks."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
]

[project.optional-dependencies]
demucs = ["demucs>=4.0", "torch>=2.0"]
web = [
    "fastapi>=0.116",
    "python-multipart>=0.0.20",
    "uvicorn>=0.35",
]
dev = [
    "httpx>=0.28",
    "pytest>=8.0",
]

[project.scripts]
twobecomeone = "twobecomeone.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twobecomeone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
