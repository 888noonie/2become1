<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0712">
  <title>2become1 Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23ff4fa3'/%3E%3Cpath d='M17 20c0-7 5-11 15-11 9 0 15 5 15 13 0 11-13 15-18 23h19v10H15c0-17 20-22 20-32 0-3-2-5-5-5-4 0-6 2-6 6l-7-4z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/assets/studio.css">
  <link rel="stylesheet" href="/assets/styles/components.css">
  <link rel="stylesheet" href="/assets/styles/studio.css">
  <link rel="stylesheet" href="/assets/styles/library.css">
  <link rel="stylesheet" href="/assets/styles/responsive.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#/studio" aria-label="2become1 Studio home">
        <span class="brand-mark" aria-hidden="true">2</span>
        <span class="brand-copy"><strong>BECOME</strong><em>ONE</em></span>
      </a>

      <nav class="nav" aria-label="Primary">
        <a class="nav__link" href="#/studio" data-route="studio">Studio</a>
        <a class="nav__link" href="#/library" data-route="library">Library</a>
        <a class="nav__link" href="#/activity" data-route="activity">
          Activity
          <span class="nav__badge" id="active-badge" hidden aria-label="active jobs">0</span>
        </a>
        <a class="nav__link" href="#/engine" data-route="engine">Engine</a>
      </nav>
    </header>

    <main id="main" class="view" tabindex="-1"></main>

    <footer class="statusbar">
      <div class="now-playing" id="now-playing" hidden>
        <span aria-hidden="true">▶</span>
        <span class="now-playing__title" id="now-playing-title"></span>
      </div>
      <span>2become1 runs locally. Your tracks stay on this machine.</span>
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div id="dialog-layer"></div>

  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
