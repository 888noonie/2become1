<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Clockwork audition</title>
    <style>
      :root { color-scheme: dark; --bg: #111214; --fg: #e8e6e1; --muted: #a4a19a; --stop: #c0392b; --line: #34363a; --accent: #c9a24a; }
      body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--fg); font: 16px/1.45 system-ui, sans-serif; }
      main { max-width: 760px; margin: 0 auto; }
      h1 { font-size: 1.35rem; margin: 0 0 8px; }
      h2 { font-size: 1rem; margin: 0 0 4px; }
      .note { color: var(--muted); margin: 6px 0 14px; }
      .controls { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
      button { min-height: 44px; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line); background: #1d1f22; color: var(--fg); font: inherit; cursor: pointer; }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      button.stop { background: var(--stop); border-color: var(--stop); color: #fff; font-weight: 700; min-width: 140px; }
      button.play { border-color: var(--accent); }
      label { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 10px 0; }
      input[type=range] { width: min(320px, 100%); }
      .status { padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; }
      .errors ul { margin: 0; padding-left: 20px; color: #f2b8a8; min-height: 1.4em; }
      .errors { margin: 12px 0; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #17181b; padding: 10px; border-radius: 6px; font-size: 13px; }
    </style>
  </head>
  <body>
    <main id="audition"><p>Loading the audition controls… (no audio is started by loading)</p></main>
    <script type="module">
      import { mountAudition } from './audition.js';
      import { auditionProject } from './fixtures.js';
      import { RealtimeEngine } from '/src/twobecomeone/studio_static/js/realtime-engine.js';
      import { EditEngine } from '/src/twobecomeone/studio_static/js/arrangement/edit-api.js';
      import { compileRenderPlan } from '/src/twobecomeone/studio_static/js/arrangement/render-plan.js';
      import SignalsmithStretch from '/src/twobecomeone/studio_static/vendor/signalsmith-stretch/SignalsmithStretch.mjs';

      window.__audition = mountAudition(document.getElementById('audition'), {
        document,
        RealtimeEngine,
        EditEngine,
        compileRenderPlan,
        auditionProject,
        // Called ONLY from the Play handler (a user gesture). Never on load.
        createContext: () => new AudioContext({ sampleRate: 48000, latencyHint: 'interactive' }),
        StretchFactory: (ctx, opts) => SignalsmithStretch(ctx, opts),
        modules: { limiterModuleUrl: '/src/twobecomeone/studio_static/js/arrangement/limiter-worklet.js' },
      });
      addEventListener('pagehide', () => { void window.__audition.closeAudio(); });
    </script>
  </body>
</html>
